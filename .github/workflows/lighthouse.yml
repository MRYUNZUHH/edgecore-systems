name: Lighthouse Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Run Lighthouse (headless)
        run: |
          npx lighthouse https://edgecore-systems.vercel.app --output=json --output-path=artifacts/lighthouse.json --chrome-flags="--no-sandbox --headless"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: artifacts/lighthouse.json
